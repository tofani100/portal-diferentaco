    <!-- No mobile, ao fazer refresh, volta sempre para a tela inicial -->
    <script>
      (function() {
        try {
          var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
          var currentPath = window.location.pathname;
          if (isMobile && currentPath !== '/' && currentPath !== '') {
            var navEntries = window.performance && window.performance.getEntriesByType ? window.performance.getEntriesByType('navigation') : null;
            var isReload = (navEntries && navEntries[0] && navEntries[0].type === 'reload') || 
                           (window.performance && window.performance.navigation && window.performance.navigation.type === 1);
            if (isReload) {
              window.location.replace('/');
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
